[project]
name = "capstone-rpm"
version = "0.1.0"
description = "Agentic AI Platform for Remote Patient Monitoring in ICU and Post-Discharge Care — ISB AMPBA capstone"
readme = "PROJECT_PLAN.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0.0",
    "mlflow>=2.14.0",
    "dvc>=3.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["warehouse", "simulators", "notes_synth", "ml", "services", "edge", "eval"]
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["notebooks/", "data/"]

[tool.pytest.ini_options]
testpaths = ["ml", "warehouse", "simulators", "services"]
