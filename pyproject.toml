[project]
name = "capstone-rpm"
version = "0.1.0"
description = "Agentic AI Platform for Remote Patient Monitoring in ICU and Post-Discharge Care — ISB AMPBA capstone"
readme = "PROJECT_PLAN.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0.0",
    "mlflow>=2.14.0",
    "dvc>=3.51.0",
    "pydantic>=2.7.0",
    "fastavro>=1.9.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "paho-mqtt>=2.1.0",
    "matplotlib>=3.8.0",
    "bleak>=0.22.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fhir.resources>=7.1.0",
    "scikit-learn>=1.5.0",
    "kafka-python-ng>=2.2.0",
    "lightgbm>=4.7.0",
    "neurokit2>=0.2.13",
    "shap>=0.51.0",
    "torch>=2.14.0",
    "wfdb>=4.3.1",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["warehouse", "simulators", "notes_synth", "ml", "services", "edge", "eval", "reports"]
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in a default argument) is a false positive throughout
# services/: FastAPI's `Depends(...)` in a parameter default is the framework's own
# required dependency-injection pattern, not the mutable-default-argument bug B008
# exists to catch.
ignore = ["B008"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["notebooks/", "data/"]

[tool.pytest.ini_options]
testpaths = ["ml", "warehouse", "simulators", "services", "edge", "notes_synth", "reports", "eval"]
# importlib mode: service directories are hyphenated (ingest-gateway, ...), which is
# not a valid Python package name, and several services each have their own
# tests/test_app.py -- importlib mode identifies modules by file path rather than
# dotted name, so neither the hyphen nor the duplicate basenames cause collisions.
addopts = "--import-mode=importlib"

[tool.uv.sources]
# PyPI's default Linux torch wheel is CUDA-enabled and drags in the entire
# nvidia-* toolkit (cublas, cudnn, cusolver, nccl, triton, ... ~2.5GB) as
# dependencies -- found for real: a service Dockerfile's `uv sync` sat
# downloading that toolkit into a CPU-only container that will never touch a
# GPU. Every service Dockerfile is Linux/amd64-or-arm64 python:3.11-slim, so
# route torch there to PyTorch's own CPU-only index instead. macOS keeps
# resolving from PyPI as before -- its wheel has no CUDA dependency to begin
# with (there's no CUDA on Apple Silicon), and PyTorch's CPU index does not
# publish macOS wheels.
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
