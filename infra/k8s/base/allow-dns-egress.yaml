# Without this, default-deny.yaml's egress block also blocks DNS -- every
# in-cluster Service-name lookup (e.g. risk-engine calling
# "http://rag-service:8004") fails before the request is even sent. Applies
# to every pod in the namespace (empty podSelector), since every one of the 9
# services needs to resolve at least one other Service name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: capstone-rpm
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
