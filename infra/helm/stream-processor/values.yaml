image:
  repository: capstone-rpm/stream-processor
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8003

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: {}
  # RISK_ENGINE_URL, RAG_SERVICE_URL, etc. -- set per service that proxies to
  # another one (see each app.py's os.environ.get(...) defaults).

# Phase 8 (PROJECT_PLAN.md section 14): resiliency and network-security
# defaults for every chart. minAvailable: 0 is deliberate at replicaCount: 1
# -- a PDB requiring 1-of-1 available would block voluntary disruptions
# (node drains, rolling upgrades) entirely on a single replica; turn this up
# once replicaCount > 1 in a real deployment.
podDisruptionBudget:
  enabled: true
  minAvailable: 0

networkPolicy:
  enabled: true

# PROJECT_PLAN.md section 14: "HPA on stream-processor and risk-engine" --
# deliverable 9's acceptance test is literally "HPA scales under k6 load"
# (section 3). Needs metrics-server in-cluster and .Values.resources.requests.cpu
# set on the container (both true here) -- HPA computes %-of-request, not an
# absolute number.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
